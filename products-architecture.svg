<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="mwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Products API Architecture</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">.NET 10 Minimal API + PostgreSQL 18 + Redis 8</text>

  <!-- Docker Compose Boundary -->
  <rect x="30" y="72" width="900" height="610" rx="10" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="42" y="64" width="160" height="20" rx="4" fill="#6366f1"/>
  <text x="122" y="78" text-anchor="middle" font-size="11" fill="white" font-weight="600">Docker Compose</text>

  <!-- Bridge Network Label -->
  <rect x="60" y="650" width="120" height="22" rx="4" fill="#e0e7ff"/>
  <text x="120" y="665" text-anchor="middle" font-size="10" fill="#4338ca" font-weight="500">Bridge Network</text>

  <!-- ==================== Client ==================== -->
  <rect x="390" y="90" width="180" height="50" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Client / Browser</text>
  <text x="480" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP :5000 | X-Api-Key</text>

  <!-- ==================== Middleware Pipeline ==================== -->
  <rect x="240" y="175" width="480" height="36" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="245" y="180" width="150" height="26" rx="5" fill="url(#mwGrad)"/>
  <text x="320" y="197" text-anchor="middle" font-size="10" font-weight="600" fill="white">ExceptionHandler</text>
  <rect x="400" y="180" width="150" height="26" rx="5" fill="url(#mwGrad)"/>
  <text x="475" y="197" text-anchor="middle" font-size="10" font-weight="600" fill="white">API Key Auth</text>
  <rect x="555" y="180" width="150" height="26" rx="5" fill="url(#mwGrad)"/>
  <text x="630" y="197" text-anchor="middle" font-size="10" font-weight="600" fill="white">Auto Migration</text>
  <text x="720" y="197" font-size="9" fill="#7c3aed" font-weight="500">Middleware</text>

  <!-- ==================== API Service ==================== -->
  <rect x="240" y="235" width="480" height="230" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="240" y="235" width="480" height="36" rx="10" fill="url(#apiGrad)"/>
  <rect x="240" y="255" width="480" height="16" fill="url(#apiGrad)"/>
  <text x="480" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="white">Products.Api (.NET 10)</text>

  <!-- Endpoints -->
  <rect x="260" y="285" width="140" height="70" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="330" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Endpoints</text>
  <text x="330" y="320" text-anchor="middle" font-size="9" fill="#64748b">GET (paginated)</text>
  <text x="330" y="333" text-anchor="middle" font-size="9" fill="#64748b">GET /{id}</text>
  <text x="330" y="346" text-anchor="middle" font-size="9" fill="#64748b">POST / PUT / DELETE</text>

  <!-- Validation + TimeProvider -->
  <rect x="410" y="285" width="140" height="70" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="480" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">Validation</text>
  <text x="480" y="320" text-anchor="middle" font-size="9" fill="#64748b">Name/Category req</text>
  <text x="480" y="333" text-anchor="middle" font-size="9" fill="#64748b">Price > 0</text>
  <text x="480" y="346" text-anchor="middle" font-size="9" fill="#64748b">TimeProvider injected</text>

  <!-- Cache Layer -->
  <rect x="560" y="285" width="140" height="70" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="630" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">IDistributedCache</text>
  <text x="630" y="320" text-anchor="middle" font-size="9" fill="#64748b">Cache-Aside</text>
  <text x="630" y="333" text-anchor="middle" font-size="9" fill="#64748b">TTL: 5 min</text>
  <text x="630" y="346" text-anchor="middle" font-size="9" fill="#64748b">Paginated keys</text>

  <!-- EF Core -->
  <rect x="260" y="370" width="140" height="70" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="330" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">EF Core + Npgsql</text>
  <text x="330" y="405" text-anchor="middle" font-size="9" fill="#64748b">AppDbContext</text>
  <text x="330" y="418" text-anchor="middle" font-size="9" fill="#64748b">Soft Delete Filter</text>
  <text x="330" y="431" text-anchor="middle" font-size="9" fill="#64748b">FirstOrDefaultAsync</text>

  <!-- OpenAPI -->
  <rect x="410" y="370" width="140" height="70" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="480" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Scalar OpenAPI</text>
  <text x="480" y="405" text-anchor="middle" font-size="9" fill="#64748b">/scalar/v1</text>
  <text x="480" y="418" text-anchor="middle" font-size="9" fill="#64748b">/openapi/v1.json</text>
  <text x="480" y="431" text-anchor="middle" font-size="9" fill="#64748b">No auth required</text>

  <!-- Logging -->
  <rect x="560" y="370" width="140" height="70" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="630" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">Structured Log</text>
  <text x="630" y="405" text-anchor="middle" font-size="9" fill="#64748b">Cache hit/miss</text>
  <text x="630" y="418" text-anchor="middle" font-size="9" fill="#64748b">CRUD operations</text>
  <text x="630" y="431" text-anchor="middle" font-size="9" fill="#64748b">ILogger&lt;Program&gt;</text>

  <!-- ==================== PostgreSQL ==================== -->
  <rect x="60" y="510" width="260" height="140" rx="10" fill="white" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="510" width="260" height="36" rx="10" fill="url(#dbGrad)"/>
  <rect x="60" y="530" width="260" height="16" fill="url(#dbGrad)"/>
  <text x="190" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="white">PostgreSQL 18</text>

  <text x="190" y="565" text-anchor="middle" font-size="11" fill="#334155">products.database</text>
  <text x="190" y="584" text-anchor="middle" font-size="10" fill="#64748b">Port: 5432 | DB: products</text>
  <text x="190" y="603" text-anchor="middle" font-size="10" fill="#64748b">Health: pg_isready</text>
  <text x="190" y="622" text-anchor="middle" font-size="10" fill="#64748b">Table: Products (uuid PK)</text>
  <text x="190" y="638" text-anchor="middle" font-size="10" fill="#94a3b8">Named Volume: database-data</text>

  <!-- ==================== Redis ==================== -->
  <rect x="640" y="510" width="260" height="140" rx="10" fill="white" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="640" y="510" width="260" height="36" rx="10" fill="url(#cacheGrad)"/>
  <rect x="640" y="530" width="260" height="16" fill="url(#cacheGrad)"/>
  <text x="770" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="white">Redis 8</text>

  <text x="770" y="565" text-anchor="middle" font-size="11" fill="#334155">products.cache</text>
  <text x="770" y="584" text-anchor="middle" font-size="10" fill="#64748b">Port: 6379 | Auth: requirepass</text>
  <text x="770" y="603" text-anchor="middle" font-size="10" fill="#64748b">Health: redis-cli -a ping</text>
  <text x="770" y="622" text-anchor="middle" font-size="10" fill="#64748b">Keys: products:all / products:{id}</text>
  <text x="770" y="638" text-anchor="middle" font-size="10" fill="#94a3b8">Named Volume: cache-data</text>

  <!-- ==================== Arrows ==================== -->
  <!-- Client -> Middleware -->
  <line x1="480" y1="140" x2="480" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="498" y="160" font-size="9" fill="#64748b">HTTP</text>

  <!-- Middleware -> API -->
  <line x1="480" y1="211" x2="480" y2="233" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- API -> PostgreSQL -->
  <line x1="330" y1="465" x2="200" y2="508" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="228" y="480" font-size="9" fill="#16a34a" transform="rotate(-18, 228, 480)">Npgsql :5432</text>

  <!-- API -> Redis -->
  <line x1="630" y1="465" x2="760" y2="508" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="722" y="480" font-size="9" fill="#dc2626" transform="rotate(18, 722, 480)">StackExchange :6379</text>

  <!-- Legend -->
  <rect x="750" y="90" width="170" height="72" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="835" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Data Flow</text>
  <line x1="765" y1="120" x2="800" y2="120" stroke="#22c55e" stroke-width="2"/>
  <text x="810" y="124" font-size="9" fill="#64748b">DB Read/Write</text>
  <line x1="765" y1="136" x2="800" y2="136" stroke="#ef4444" stroke-width="2"/>
  <text x="810" y="140" font-size="9" fill="#64748b">Cache Read/Write</text>
  <line x1="765" y1="152" x2="800" y2="152" stroke="#7c3aed" stroke-width="2"/>
  <text x="810" y="156" font-size="9" fill="#64748b">Middleware</text>
</svg>
